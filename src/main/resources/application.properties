# thymeleaf
# 生产默认开启模板缓存；本地需要模板热更新时 export THYMELEAF_CACHE=false
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.thymeleaf.content-type=text/html
spring.thymeleaf.enabled=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML5
# 拼接前缀后缀（templates目录里面放置模板文件）
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# mybatis
mybatis.type-aliases-package=com.lijs.seckill.domain
# 下划线转换为驼峰
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
# mybatis 默认语句超时时间 3s
mybatis.configuration.default-statement-timeout=3000
# mybatis 配置文件路径
mybatis.mapper-locations=classpath:com/lijs/seckill/dao/*.xml
# druid
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/seckill?useUnicode=true&characterEncoding=utf-8}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.filters=stat
spring.datasource.initialSize=5
spring.datasource.minIdle=5
spring.datasource.maxActive=50
spring.datasource.maxWait=60000
spring.datasource.timeBetweenEvictionRunsMillis=60000
spring.datasource.minEvictableIdleTimeMillis=30000
spring.datasource.validationQuery=select 'x'
spring.datasource.testWhileIdle=true
spring.datasource.testOnBorrow=false
spring.datasource.testOnReturn=false
spring.datasource.poolPreparedStatements=true
spring.datasource.maxPoolPreparedStatementPerConnectionSize=20
# redis
redis.host=${REDIS_HOST:127.0.0.1}
redis.port=${REDIS_PORT:6379}
redis.timeout=${REDIS_TIMEOUT:10}
redis.password=${REDIS_PASSWORD:}
redis.poolMaxTotal=1000
redis.poolMaxldle=500
redis.poolMinldle=100
redis.poolMaxWait=500
# static  静态资源配置（静态文件路径css,js,图片）
spring.resources.add-mappings=true
# 静态资源缓存时间（单位：秒）
spring.resources.cache.cachecontrol.max-age=3600
# 启用 Gzip 压缩
spring.resources.chain.compressed=true
spring.resources.chain.cache=true
spring.resources.chain.enabled=true
spring.resources.chain.html-application-cache=true
spring.resources.static-locations=classpath:/static/
# RabbitMQ配置
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
# 消费者并发数量
spring.rabbitmq.listener.simple.concurrency=10
spring.rabbitmq.listener.simple.max-concurrency=10
# 每次从队列取 1 条，处理完再取下一条，避免积压过多
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.auto-startup=true
# 手动 ACK：由消费者代码显式调用 basicAck / basicNack
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# 关闭自动 requeue：异常消息走死信队列而非无限重投
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# 生产者发送重试（TCP 闪断时最多重试3次）
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.max-interval=10000
spring.rabbitmq.template.retry.multiplier=1.0
# Publisher Confirm：Broker 未落盘时回调 ConfirmCallback，触发 Redis 库存回滚
spring.rabbitmq.publisher-confirm-type=correlated
# 库存对账任务（StockReconcileTask）
# 修复"Redis 已预扣但消息未入队"导致的库存泄漏；仅在队列排空时执行
seckill.reconcile.interval-ms=300000
seckill.reconcile.initial-delay-ms=60000
# 未支付订单关闭：默认15分钟超时，每分钟扫描100条
order.close.unpaid-timeout-ms=${ORDER_UNPAID_TIMEOUT_MS:900000}
order.close.interval-ms=${ORDER_CLOSE_INTERVAL_MS:60000}
order.close.initial-delay-ms=${ORDER_CLOSE_INITIAL_DELAY_MS:60000}
order.close.batch-size=${ORDER_CLOSE_BATCH_SIZE:100}
spring.rabbitmq.publisher-returns=true

# Cookie security. Keep false for local HTTP demos; enable in HTTPS deployments.
security.cookie.secure=${COOKIE_SECURE:false}

# Actuator / Prometheus（生产环境应通过独立管理端口或内网策略限制访问）
spring.application.name=seckill
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.environment=${APP_ENV:local}
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Claude AI 导购配置
claude.api.key=${CLAUDE_API_KEY:}
claude.api.url=${CLAUDE_API_URL:https://api.anthropic.com/v1/messages}
claude.api.model=${CLAUDE_API_MODEL:claude-haiku-4-5-20251001}
claude.api.maxTokens=${CLAUDE_API_MAX_TOKENS:1024}
