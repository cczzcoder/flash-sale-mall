<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>闪惠智购商城 — 商品详情</title>
    <script src="/jquery-validation/lib/jquery-1.11.1.js"></script>
    <script src="/js/csrf.js"></script>
    <link rel="stylesheet" href="/layui/css/layui.css"/>
    <script src="/layer/layer.js"></script>
    <style>
        body { background: #f4f4f8; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; margin: 0; color: #333; min-width: 1200px; }
        /* ---------- 顶部导航 ---------- */
        .topbar { background: linear-gradient(135deg,#1a1a2e,#16213e); height: 64px; }
        .topbar-inner { width: 1200px; margin: 0 auto; height: 100%; display: flex; align-items: center; justify-content: space-between; }
        .brand { color: #fff; font-size: 20px; font-weight: 900; letter-spacing: 1px; text-decoration: none; }
        .brand:hover { color: #fff; text-decoration: none; }
        .accent { color: #e74c3c; }
        .topnav a { color: rgba(255,255,255,.72); font-size: 14px; text-decoration: none; margin-right: 28px; }
        .topnav a:hover, .topnav a.active { color: #fff; }
        /* ---------- 布局 ---------- */
        .pc-container { width: 1200px; margin: 18px auto 60px; }
        .crumb { margin-bottom: 16px; font-size: 13px; color: #999; }
        .crumb a { color: #999; text-decoration: none; }
        .crumb a:hover { color: #e74c3c; }
        .crumb .sep { margin: 0 8px; color: #ddd; }
        .crumb .cur { color: #333; }
        #userTip { display: block; color: #e74c3c; font-size: 13px; margin-bottom: 14px;
                   background: #fff5f5; border: 1px solid #ffe0dc; border-radius: 8px; padding: 11px 16px; }
        #userTip a { color: #e74c3c; font-weight: 600; }
        /* ---------- 详情卡片 ---------- */
        .detail-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 14px rgba(0,0,0,.07); overflow: hidden; }
        .thumb-col { background: linear-gradient(135deg,#f5f5f5,#ececec); display: flex; align-items: center;
                     justify-content: center; font-size: 110px; min-height: 520px; overflow: hidden; }
        .thumb-col img { width: 100%; height: 100%; object-fit: cover; }
        .info-col { padding: 34px 40px 40px 34px; }
        .goods-title { font-size: 24px; font-weight: 800; color: #222; margin: 0 0 18px; line-height: 1.4; }
        .price-block { background: #fff8f8; border-radius: 10px; padding: 18px 24px;
                       margin-bottom: 20px; display: flex; align-items: baseline; gap: 14px; }
        .price-seckill { font-size: 40px; font-weight: 900; color: #e74c3c; }
        .price-seckill::before { content: '¥'; font-size: 20px; }
        .price-origin { font-size: 14px; color: #aaa; text-decoration: line-through; }
        .price-origin::before { content: '原价 ¥'; }
        .meta-row { display: flex; font-size: 14px; color: #555; margin-bottom: 14px; align-items: center; }
        .meta-row .lbl { color: #999; width: 88px; flex-shrink: 0; }
        #addressSelect { border: 1px solid #dcdfe6; border-radius: 6px; padding: 8px 10px; font-size: 13px;
                         color: #555; max-width: 460px; outline: none; background: #fff; }
        #addressSelect:disabled { background: #f7f7f7; color: #aaa; }
        .addr-manage { margin-left: 10px; color: #e74c3c; font-size: 13px; text-decoration: none; }
        .addr-manage:hover { color: #c0392b; }
        .countdown-box { background: #1a1a2e; color: #fff; border-radius: 10px;
                         padding: 14px 20px; margin-bottom: 18px; font-size: 15px; min-height: 48px;
                         display: flex; align-items: center; }
        .countdown-box strong { color: #f39c12; font-size: 20px; }
        .vcode-row { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
        #verifyCodeImg { border-radius: 6px; cursor: pointer; height: 40px; border: 1px solid #eee; }
        #verifyCode { border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 9px 12px;
                      font-size: 14px; width: 130px; outline: none; }
        #verifyCode:focus { border-color: #e74c3c; }
        .btn-seckill { background: linear-gradient(135deg,#e74c3c,#c0392b); color: #fff; border: none;
                       border-radius: 10px; padding: 15px 0; width: 300px; font-size: 17px; font-weight: 700;
                       cursor: pointer; letter-spacing: 2px; transition: opacity .2s; }
        .btn-seckill:disabled { opacity: .4; cursor: not-allowed; }
        .btn-seckill:not(:disabled):hover { opacity: .87; }
    </style>
</head>
<body>
<div class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="/goods/list">⚡ 闪惠<span class="accent">智购</span>商城</a>
        <div class="topnav">
            <a href="/goods/list">商城首页</a>
            <a href="/user.htm">个人中心</a>
            <a href="/order_list.htm">我的订单</a>
            <a href="/address.htm">地址管理</a>
            <a href="/merchant.htm">商家中心</a>
        </div>
        <div style="width:120px"></div>
    </div>
</div>

<div class="pc-container">
    <div class="crumb">
        <a href="/goods/list">首页</a><span class="sep">/</span><a href="/goods/list">商品列表</a><span class="sep">/</span><span class="cur">商品详情</span>
    </div>

    <span id="userTip">您还没有登录，请<a id="loginLink" href="/login/index">点此登录</a>后参与秒杀</span>
    <input type="hidden" id="goodsId"/>

    <div class="detail-card">
        <div class="layui-row">
            <div class="layui-col-xs5">
                <div class="thumb-col"><span id="goodsPlaceholder">🛍️</span><img id="goodsImage" style="display:none" alt="商品图片"/></div>
            </div>
            <div class="layui-col-xs7">
                <div class="info-col">
                    <h1 class="goods-title" id="goodsName">加载中...</h1>
                    <div class="price-block">
                        <span class="price-seckill" id="seckillPrice">—</span>
                        <span class="price-origin"  id="goodsPrice">—</span>
                    </div>
                    <div class="meta-row"><span class="lbl">库存</span><span id="stockCount">—</span>&nbsp;件</div>
                    <div class="meta-row"><span class="lbl">开抢时间</span><span id="startTime">—</span></div>
                    <div class="meta-row"><span class="lbl">收货地址</span>
                        <select id="addressSelect" disabled><option value="">请先登录并设置地址</option></select>
                        <a class="addr-manage" href="/address.htm">管理</a>
                    </div>
                    <div id="seckillTip" class="countdown-box">加载中...</div>
                    <input type="hidden" id="remainingSeconds"/>
                    <div class="vcode-row">
                        <img id="verifyCodeImg" style="display:none" onclick="refreshVCode()"/>
                        <input id="verifyCode" placeholder="请输入图片中的数字验证码" style="display:none"/>
                    </div>
                    <button class="btn-seckill" type="button" id="buyButton" onclick="getSeckillPath()">⚡ 立即秒杀</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var SESSION_ERROR = 500210;
    var POLL_INTERVAL_INIT = 200, POLL_INTERVAL_MAX = 3000, POLL_TIMEOUT_MS = 60000;
    var pollInterval, pollDeadline, pollTimer, countdownTimer;
    var submitting = false;
    var addressReady = false;
    var soldOut = false;

    $(function () {
        $("#loginLink").attr("href", "/login/index?redirect=" + encodeURIComponent(window.location.pathname + window.location.search));
        getDetail();
    });

    function getGoodsIdFromUrl() {
        var value;
        try { value = new URLSearchParams(window.location.search).get("goodsId"); }
        catch (e) { value = null; }
        return /^\d+$/.test(value || "") && Number(value) > 0 ? value : null;
    }

    function redirectToLogin() {
        var redirect = window.location.pathname + window.location.search;
        window.location.replace("/login/index?redirect=" + encodeURIComponent(redirect));
    }

    function handleApiError(data, fallback) {
        if (data && Number(data.code) === SESSION_ERROR) {
            layer.msg("登录已失效，请重新登录", {time: 1000}, redirectToLogin);
            return true;
        }
        layer.msg((data && data.msg) || fallback || "请求失败，请稍后重试");
        return false;
    }

    function setSubmitting(value, text) {
        submitting = value;
        var button = $("#buyButton");
        button.text(text || "⚡ 立即秒杀");
        button.prop("disabled", value || soldOut || Number($("#remainingSeconds").val()) !== 0);
    }

    function getSeckillPath() {
        if (submitting) { return; }
        var goodsId = $("#goodsId").val();
        var verifyCode = $.trim($("#verifyCode").val());
        if (!goodsId) { layer.msg("商品信息尚未加载完成"); return; }
        if (!addressReady || !$("#addressSelect").val()) { layer.msg("请先设置收货地址"); return; }
        if (!/^\d+$/.test(verifyCode)) { layer.msg("请输入图片中的数字验证码"); return; }
        setSubmitting(true, "正在验证...");
        $.ajax({
            url: "/seckill/getPath", type: "GET",
            data: { goodsId: goodsId, verifyCode: verifyCode },
            success: function (data) {
                if (data && Number(data.code) === 0 && data.data) { doSeckill(data.data); }
                else { setSubmitting(false); handleApiError(data, "验证码校验失败"); refreshVCode(); }
            },
            error: function () { setSubmitting(false); layer.msg("网络异常，请稍后重试"); refreshVCode(); }
        });
    }

    function getSeckillResult(goodsId) {
        if (pollInterval === undefined) {
            pollInterval = POLL_INTERVAL_INIT;
            pollDeadline = Date.now() + POLL_TIMEOUT_MS;
        }
        $.ajax({
            url: "/seckill/result", type: "GET", data: { goodsId: goodsId },
            success: function (data) {
                if (data && Number(data.code) === 0) {
                    var result = Number(data.data);
                    if (result < 0) {
                        resetPoll(); setSubmitting(false); layer.msg("抱歉，秒杀失败！"); refreshVCode();
                    } else if (result === 0) {
                        if (Date.now() >= pollDeadline) {
                            resetPoll(); setSubmitting(false);
                            layer.msg("排队超时，请稍后在订单列表中确认结果");
                            return;
                        }
                        pollTimer = setTimeout(function () { getSeckillResult(goodsId); }, pollInterval);
                        pollInterval = Math.min(Math.floor(pollInterval * 1.5), POLL_INTERVAL_MAX);
                        $("#buyButton").text("排队处理中...");
                    } else if (Number.isSafeInteger(result)) {
                        resetPoll();
                        window.location.replace("/order_detail.htm?orderId=" + encodeURIComponent(result));
                    } else {
                        resetPoll(); setSubmitting(false); layer.msg("返回的订单信息无效");
                    }
                } else {
                    resetPoll(); setSubmitting(false); handleApiError(data, "查询秒杀结果失败");
                }
            },
            error: function () { resetPoll(); setSubmitting(false); layer.msg("网络异常，请稍后重试"); }
        });
    }

    function resetPoll() {
        if (pollTimer) { clearTimeout(pollTimer); }
        pollTimer = null;
        pollInterval = undefined;
        pollDeadline = undefined;
    }

    function doSeckill(path) {
        setSubmitting(true, "正在提交...");
        $.ajax({
            url: "/seckill/" + encodeURIComponent(path) + "/seckillWithCacheAndMQ", type: "POST",
            data: { goodsId: $("#goodsId").val(), deliveryAddrId: $("#addressSelect").val() },
            success: function (data) {
                if (data && Number(data.code) === 0) {
                    resetPoll(); $("#buyButton").text("排队处理中...");
                    getSeckillResult($("#goodsId").val());
                } else { setSubmitting(false); handleApiError(data, "秒杀提交失败"); refreshVCode(); }
            },
            error: function () { setSubmitting(false); layer.msg("网络异常，请稍后重试"); refreshVCode(); }
        });
    }

    function fmtDateTime(v) {
        if (!v) { return "—"; }
        var d = new Date(v);
        if (isNaN(d.getTime())) { return v; }
        function p(n) { return (n < 10 ? '0' : '') + n; }
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    function render(detail) {
        var goods = detail && detail.goodsVo;
        if (!goods || !goods.id) { layer.msg("商品信息不存在"); return; }
        if (detail.user != null) { $("#userTip").hide(); }
        $("#goodsName").text(goods.goodsName || "—");
        if (goods.goodsImg) { $("#goodsImage").attr("src", goods.goodsImg).show(); $("#goodsPlaceholder").hide(); }
        $("#startTime").text(fmtDateTime(goods.startDate));
        $("#remainingSeconds").val(detail.remainingSeconds);
        $("#goodsId").val(goods.id);
        $("#goodsPrice").text(goods.goodsPrice);
        $("#seckillPrice").text(goods.seckillPrice);
        soldOut = Number(goods.stockCount || 0) <= 0;
        $("#stockCount").text(goods.stockCount == null ? "0" : goods.stockCount);
        if (detail.user != null) { loadAddresses(); }
        countDown();
    }

    function loadAddresses() {
        $.ajax({
            url: "/address/list", type: "GET",
            success: function (data) {
                var select = $("#addressSelect").empty();
                if (!data || Number(data.code) !== 0 || !data.data || !data.data.length) {
                    select.append($('<option>').val('').text('暂无收货地址，请先添加'));
                    addressReady = false;
                    return;
                }
                $.each(data.data, function (_, address) {
                    var text = address.receiverName + " " + address.receiverMobile + " "
                        + address.province + address.city + address.district + address.detail;
                    select.append($('<option>').val(address.id).text(text));
                });
                var defaultAddress = data.data.find(function (address) { return address.defaultAddress; });
                if (defaultAddress) { select.val(String(defaultAddress.id)); }
                select.prop('disabled', false);
                addressReady = true;
            },
            error: function () { addressReady = false; }
        });
    }

    function getDetail() {
        var goodsId = getGoodsIdFromUrl();
        if (!goodsId) {
            $("#goodsName").text("商品参数无效");
            $("#seckillTip").text("请返回商品列表重新选择");
            $("#buyButton").prop("disabled", true);
            return;
        }
        $.ajax({
            url: "/goods/detailStatic/" + encodeURIComponent(goodsId), type: "GET",
            success: function (data) {
                if (data && Number(data.code) === 0) { render(data.data); }
                else { handleApiError(data, "商品加载失败"); }
            },
            error: function () { layer.msg("商品加载失败，请稍后重试"); }
        });
    }

    function refreshVCode() {
        var goodsId = $("#goodsId").val();
        if (goodsId) {
            $("#verifyCode").val("");
            $("#verifyCodeImg").attr("src", "/seckill/verifyCode?goodsId=" + encodeURIComponent(goodsId) + "&timestamp=" + Date.now());
        }
    }

    function countDown() {
        var s = Number($("#remainingSeconds").val());
        if (countdownTimer) { clearTimeout(countdownTimer); }
        if (s > 0) {
            $("#buyButton").prop("disabled", true);
            $("#seckillTip").html("⏳ 距开抢：<strong>" + Math.ceil(s) + "</strong> 秒");
            countdownTimer = setTimeout(function () {
                $("#remainingSeconds").val(s - 1); countDown();
            }, 1000);
        } else if (s === 0) {
            if (soldOut) {
                $("#buyButton").prop("disabled", true);
                $("#seckillTip").html("本场秒杀已售罄");
            } else {
                setSubmitting(false);
                $("#seckillTip").html("🔥 秒杀进行中！");
                $("#verifyCodeImg, #verifyCode").show();
                refreshVCode();
            }
        } else {
            $("#buyButton").prop("disabled", true);
            $("#seckillTip").html("本场秒杀已结束");
            $("#verifyCodeImg, #verifyCode").hide();
        }
    }
</script>
</body>
</html>
