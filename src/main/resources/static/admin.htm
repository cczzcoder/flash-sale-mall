<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>管理员控制台</title>
    <script src="/jquery-validation/lib/jquery-1.11.1.js"></script><script src="/js/csrf.js"></script>
    <script src="/js/md5.min.js"></script>
    <style>
        body{margin:0;background:#f4f4f8;color:#222;font-family:'Microsoft YaHei',sans-serif}.bar{background:#1a1a2e;color:#fff;padding:16px 24px}
        .wrap{max-width:1100px;margin:24px auto;padding:0 16px}.panel{background:#fff;border-radius:8px;padding:18px;margin-bottom:16px}
        h2{font-size:18px;margin:0 0 16px}.login{max-width:420px;margin:60px auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
        input,textarea{box-sizing:border-box;width:100%;padding:9px;border:1px solid #ddd;border-radius:4px}textarea{min-height:70px}.wide{grid-column:1/-1}
        button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer}.primary{background:#e74c3c;color:#fff}.danger{background:#fbe9e7;color:#c0392b}
        table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #eee;text-align:left;padding:9px 6px}th{color:#888;font-weight:normal}.muted{color:#888;font-size:12px}
        @media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}table{display:block;overflow:auto;white-space:nowrap}}
    </style>
</head>
<body>
<div class="bar">闪惠智购 · 管理控制台 <button id="logout" style="float:right;display:none">退出</button></div>
<div class="wrap">
    <section class="panel login" id="loginPanel"><h2>管理员登录</h2><input id="username" placeholder="用户名"/><br/><br/><input id="password" type="password" placeholder="密码"/><br/><br/><button class="primary" id="loginButton">登录</button><span id="loginError" class="muted"></span></section>
    <div id="console" style="display:none">
        <section class="panel"><h2>商品与秒杀活动</h2><form id="goodsForm"><input type="hidden" id="goodsId"/><div class="grid"><input id="goodsName" placeholder="商品名称" required/><input id="goodsTitle" placeholder="商品标题" required/><input id="goodsImg" placeholder="图片路径"/><input id="goodsPrice" type="number" step="0.01" placeholder="原价" required/><input id="seckillPrice" type="number" step="0.01" placeholder="秒杀价" required/><input id="stockCount" type="number" min="0" placeholder="库存" required/><input id="startDate" type="datetime-local" required/><input id="endDate" type="datetime-local" required/><textarea id="goodsDetail" class="wide" placeholder="商品详情"></textarea></div><br/><button class="primary" type="submit">保存</button> <button type="button" onclick="resetGoods()">清空</button></form><div id="goodsTable" style="margin-top:18px"></div></section>
        <section class="panel"><h2>订单履约</h2><div id="orderTable"></div></section>
        <section class="panel"><h2>用户</h2><div id="userTable"></div></section>
    </div>
</div>
<script>
var token=localStorage.getItem('adminToken');
function authHeaders(){return {'X-Admin-Token':token};}
function fail(data){ if(data&&Number(data.code)===500220){localStorage.removeItem('adminToken');token=null;showLogin();} else alert((data&&data.msg)||'请求失败'); }
function showLogin(){$('#loginPanel').show();$('#console,#logout').hide();}
function showConsole(){$('#loginPanel').hide();$('#console,#logout').show();loadGoods();loadOrders();loadUsers();}
function login(){var raw=$('#password').val(),salt='1a2b3c4d';var form=md5(salt[0]+salt[2]+raw+salt[5]+salt[4]);$.post('/admin/auth/login',{username:$.trim($('#username').val()),password:form},function(data){if(data&&Number(data.code)===0){token=data.data;localStorage.setItem('adminToken',token);showConsole();}else{$('#loginError').text((data&&data.msg)||'登录失败');}});}
function dateValue(id){return $('#'+id).val().replace('T',' ')+':00';}
function payload(){return {goodsId:$('#goodsId').val()||null,goodsName:$.trim($('#goodsName').val()),goodsTitle:$.trim($('#goodsTitle').val()),goodsImg:$('#goodsImg').val(),goodsDetail:$('#goodsDetail').val(),goodsPrice:$('#goodsPrice').val(),seckillPrice:$('#seckillPrice').val(),stockCount:$('#stockCount').val(),startDate:dateValue('startDate'),endDate:dateValue('endDate')};}
function loadGoods(){$.ajax({url:'/admin/goods/list',headers:authHeaders(),success:function(data){if(!data||Number(data.code)!==0){fail(data);return;}var html='<table><tr><th>ID</th><th>商品</th><th>秒杀价</th><th>库存</th><th>时间</th><th></th></tr>';$.each(data.data,function(_,g){html+='<tr><td>'+g.id+'</td><td>'+escapeHtml(g.goodsName)+'</td><td>'+g.seckillPrice+'</td><td>'+g.stockCount+'</td><td>'+g.startDate+' ~ '+g.endDate+'</td><td><button onclick="editGoods('+g.id+')">编辑</button> <button onclick="restockGoods('+g.id+')">补货</button> <button class="danger" onclick="deleteGoods('+g.id+')">删除</button></td></tr>';});$('#goodsTable').html(html+'</table>');}});}
function editGoods(id){$.ajax({url:'/admin/goods/list',headers:authHeaders(),success:function(data){var g=$.grep(data.data,function(x){return Number(x.id)===Number(id);})[0];if(g){$('#goodsId').val(g.id);$('#goodsName').val(g.goodsName);$('#goodsTitle').val(g.goodsTitle);$('#goodsImg').val(g.goodsImg);$('#goodsDetail').val(g.goodsDetail);$('#goodsPrice').val(g.goodsPrice);$('#seckillPrice').val(g.seckillPrice);$('#stockCount').val(g.stockCount);$('#startDate').val(String(g.startDate).replace(' ','T').slice(0,16));$('#endDate').val(String(g.endDate).replace(' ','T').slice(0,16));window.scrollTo(0,0);}}});}
function resetGoods(){$('#goodsForm')[0].reset();$('#goodsId').val('');}
function deleteGoods(id){if(!confirm('确认删除商品？'))return;$.ajax({url:'/admin/goods/delete',type:'POST',headers:authHeaders(),data:{goodsId:id},success:function(data){if(data&&Number(data.code)===0)loadGoods();else fail(data);}});}
function restockGoods(id){var count=window.prompt('请输入补货数量（正整数）','10');if(count===null)return;count=parseInt(count,10);if(!Number.isInteger(count)||count<=0){alert('补货数量必须大于0');return;}$.ajax({url:'/admin/goods/restock',type:'POST',headers:authHeaders(),data:{goodsId:id,count:count},success:function(data){if(data&&Number(data.code)===0)loadGoods();else fail(data);}});}
function loadOrders(){$.ajax({url:'/admin/orders/list',headers:authHeaders(),success:function(data){if(!data||Number(data.code)!==0){fail(data);return;}var html='<table><tr><th>订单</th><th>用户</th><th>商品</th><th>金额</th><th>状态</th><th>物流</th><th>售后</th><th></th></tr>';$.each(data.data,function(_,o){var logistics=o.trackingNumber?escapeHtml((o.shippingCompany||'')+' '+o.trackingNumber):'-';var refund=o.refundRequestDate?'原因：'+escapeHtml(o.refundReason||'-')+'<br/>申请：'+escapeHtml(o.refundRequestDate):'-';var action=Number(o.orderStatus)===1?'<button onclick="ship('+o.id+')">发货</button>':'';if(o.refundRequestDate&&Number(o.orderStatus)!==6)action+='<button onclick="approveRefund('+o.id+')">同意退款</button>';html+='<tr><td>'+o.id+'</td><td>'+o.userId+'</td><td>'+escapeHtml(o.goodsName||'')+'</td><td>'+o.goodsPrice+'</td><td>'+status(o.orderStatus)+'</td><td>'+logistics+'</td><td>'+refund+'</td><td>'+action+'</td></tr>';});$('#orderTable').html(html+'</table>');}});}
function loadUsers(){$.ajax({url:'/admin/users/list',headers:authHeaders(),success:function(data){if(!data||Number(data.code)!==0){fail(data);return;}var html='<table><tr><th>ID</th><th>昵称</th><th>注册时间</th><th>登录次数</th></tr>';$.each(data.data,function(_,u){html+='<tr><td>'+u.id+'</td><td>'+escapeHtml(u.nickname)+'</td><td>'+u.registerDate+'</td><td>'+u.loginCount+'</td></tr>';});$('#userTable').html(html+'</table>');}});}
function ship(id){var shippingCompany=window.prompt('请输入物流公司','顺丰速运');if(shippingCompany===null)return;shippingCompany=$.trim(shippingCompany);var trackingNumber=window.prompt('请输入物流单号');if(trackingNumber===null)return;trackingNumber=$.trim(trackingNumber);if(!shippingCompany||!trackingNumber){alert('物流公司和物流单号不能为空');return;}$.ajax({url:'/admin/orders/ship',type:'POST',headers:authHeaders(),data:{orderId:id,shippingCompany:shippingCompany,trackingNumber:trackingNumber},success:function(data){if(data&&Number(data.code)===0)loadOrders();else fail(data);}});}
function approveRefund(id){if(!confirm('确认同意退款？演示环境将直接标记为已退款。'))return;$.ajax({url:'/admin/orders/refund/approve',type:'POST',headers:authHeaders(),data:{orderId:id},success:function(data){if(data&&Number(data.code)===0)loadOrders();else fail(data);}});}
function status(v){return ['待支付','待发货','已发货','已收货','已关闭','已完成','已退款'][Number(v)]||'未知';}
function escapeHtml(v){return $('<div>').text(v==null?'':v).html();}
$('#loginButton').on('click',login);$('#logout').on('click',function(){ $.ajax({url:'/admin/auth/logout',headers:authHeaders(),success:function(){localStorage.removeItem('adminToken');token=null;showLogin();}});});$('#goodsForm').on('submit',function(e){e.preventDefault();$.ajax({url:'/admin/goods/save',type:'POST',headers:authHeaders(),data:payload(),success:function(data){if(data&&Number(data.code)===0){resetGoods();loadGoods();}else fail(data);}});});if(token)showConsole();else showLogin();
</script>
</body>
</html>
