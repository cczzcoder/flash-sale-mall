<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>个人中心 - 闪惠智购商城</title>
    <link rel="stylesheet" href="/layui/css/layui.css"/>
    <style>
        body{margin:0;background:#f4f4f8;font-family:'PingFang SC','Microsoft YaHei',sans-serif;color:#333;min-width:1200px}
        /* ---------- 顶部导航 ---------- */
        .topbar{background:linear-gradient(135deg,#1a1a2e,#16213e);height:64px}
        .topbar-inner{width:1200px;margin:0 auto;height:100%;display:flex;align-items:center;justify-content:space-between}
        .brand{color:#fff;font-size:20px;font-weight:900;letter-spacing:1px;text-decoration:none}
        .brand:hover{color:#fff;text-decoration:none}
        .accent{color:#e74c3c}
        .topnav a{color:rgba(255,255,255,.72);font-size:14px;text-decoration:none;margin-right:28px}
        .topnav a:hover,.topnav a.active{color:#fff}
        .user-area{display:flex;align-items:center;gap:16px}
        .user-area .nick{color:#fff;font-size:14px}
        .btn-logout{background:transparent;border:1px solid rgba(255,255,255,.4);color:rgba(255,255,255,.85);border-radius:4px;padding:5px 14px;font-size:13px;cursor:pointer}
        .btn-logout:hover{border-color:#fff;color:#fff}
        /* ---------- 品牌色覆盖（layui 默认主色 -> 站点红） ---------- */
        .layui-btn{background-color:#e74c3c}
        .layui-btn:hover{background-color:#d0392a;color:#fff}
        .layui-btn-primary{background-color:#fff;border-color:#d2d2d2;color:#555}
        .layui-btn-primary:hover{background-color:#fff;border-color:#e74c3c;color:#e74c3c}
        .layui-form-checked[lay-skin="primary"]>i{border-color:#e74c3c!important;background-color:#e74c3c!important}
        .layui-form-checkbox[lay-skin="primary"]:hover>i{border-color:#e74c3c!important}
        .layui-layer-btn .layui-layer-btn0{background-color:#e74c3c!important;border-color:#e74c3c!important}
        /* ---------- 布局 ---------- */
        .pc-container{width:1200px;margin:22px auto 60px}
        .ucard{background:linear-gradient(135deg,#e74c3c,#c0392b);border-radius:10px;padding:26px 18px;color:#fff;text-align:center;margin-bottom:14px}
        .ucard .avatar{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;overflow:hidden;font-size:42px}
        .ucard .avatar img{width:100%;height:100%;object-fit:cover}
        .ucard .name{font-size:17px;font-weight:700;margin-bottom:6px;word-break:break-all}
        .ucard .phone{font-size:13px;opacity:.82}
        .uc-menu{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05)}
        .uc-menu a{display:flex;align-items:center;gap:10px;padding:15px 20px;color:#555;font-size:14px;text-decoration:none;border-left:3px solid transparent;cursor:pointer}
        .uc-menu a:hover{background:#fafafa;color:#e74c3c}
        .uc-menu a.on{background:#fdf3f2;color:#e74c3c;border-left-color:#e74c3c;font-weight:700}
        .panel{background:#fff;border-radius:10px;padding:28px 32px;display:none;min-height:560px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
        .panel.on{display:block}
        .panel-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
        .panel h3{font-size:19px;margin:0;font-weight:800}
        .panel .desc{color:#999;font-size:13px;margin:6px 0 24px}
        /* ---------- 个人资料 ---------- */
        .avatar-preview{width:88px;height:88px;border-radius:50%;background:#f4f4f8;border:1px dashed #ddd;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:46px;color:#bbb;margin-top:4px}
        .avatar-preview img{width:100%;height:100%;object-fit:cover}
        .account-info{border-left:1px solid #f0f0f0;padding-left:34px}
        .account-info .row-item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px dashed #eee;font-size:14px}
        .account-info .k{color:#999}
        .account-info .v{color:#333;font-weight:500}
        /* ---------- 订单表 ---------- */
        .layui-table{margin-top:6px}
        .layui-table thead tr{background:#fafafa}
        .layui-table th{font-weight:700;color:#555}
        .t-empty{padding:70px 10px!important;text-align:center;color:#999}
        .g-name{font-weight:600;margin-bottom:4px}
        .g-meta{font-size:12px;color:#999;line-height:1.7}
        .st{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;white-space:nowrap}
        .st-0{background:#fff3e0;color:#e67e22}
        .st-1{background:#e8f5e9;color:#2e7d32}
        .st-2{background:#e3f2fd;color:#1565c0}
        .st-3{background:#ede7f6;color:#5e35b1}
        .st-4{background:#f5f5f5;color:#999}
        .st-5{background:#e0f2f1;color:#00695c}
        .st-6{background:#ffebee;color:#c62828}
        .ops .layui-btn{margin:2px 4px 2px 0}
        /* ---------- 收货地址 ---------- */
        .addr-card{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid #f0f0f0;border-radius:8px;padding:14px 16px;margin-bottom:12px;transition:border-color .2s}
        .addr-card:hover{border-color:#e74c3c}
        .addr-line1{font-size:14px;font-weight:700;margin-bottom:6px}
        .addr-phone{color:#888;font-weight:400;margin-left:8px}
        .addr-line2{font-size:13px;color:#666;line-height:1.6}
        .addr-ops{white-space:nowrap}
        .addr-form-card{background:#fafafa;border-radius:8px;padding:22px 22px 8px}
        .addr-form-card h4{margin:0 0 18px;font-size:15px}
        .empty-tip{border:1px dashed #e5e5e5;border-radius:8px;padding:46px 10px;text-align:center;color:#999;font-size:13px}
        .empty-tip .layui-btn{margin-top:14px}
    </style>
</head>
<body>
<div class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="/goods/list">⚡ 闪惠<span class="accent">智购</span>商城</a>
        <div class="topnav">
            <a href="/goods/list">商城首页</a>
            <a href="/user.htm" class="active">个人中心</a>
            <a href="/merchant.htm">商家中心</a>
        </div>
        <div class="user-area">
            <span class="nick" id="topNick">—</span>
            <button type="button" class="btn-logout" id="logoutBtn">退出登录</button>
        </div>
    </div>
</div>

<div class="pc-container">
    <div class="layui-row layui-col-space16">
        <div class="layui-col-xs2 layui-col-md2">
            <div class="ucard">
                <div class="avatar" id="ucardAvatar"></div>
                <div class="name" id="ucardName">—</div>
                <div class="phone" id="ucardPhone"></div>
            </div>
            <div class="uc-menu">
                <a data-panel="profile" class="on"><i class="layui-icon layui-icon-username"></i>个人资料</a>
                <a data-panel="orders"><i class="layui-icon layui-icon-list"></i>我的秒杀订单</a>
                <a data-panel="address"><i class="layui-icon layui-icon-location"></i>收货地址管理</a>
            </div>
        </div>

        <div class="layui-col-xs10 layui-col-md10">
            <!-- 个人资料 -->
            <div class="panel on" id="panel-profile">
                <div class="panel-head"><h3>个人资料</h3></div>
                <p class="desc">手机号即登录账号，暂不支持修改；昵称与头像保存后全站实时生效</p>
                <div class="layui-row layui-col-space30">
                    <div class="layui-col-xs6 layui-col-md6">
                        <div class="layui-form" lay-filter="profileForm">
                            <div class="layui-form-item">
                                <label class="layui-form-label">头像预览</label>
                                <div class="layui-input-block">
                                    <div class="avatar-preview" id="avatarPreview"></div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">昵称</label>
                                <div class="layui-input-block">
                                    <input id="nickname" class="layui-input" maxlength="64" placeholder="请输入昵称"/>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">头像地址</label>
                                <div class="layui-input-block">
                                    <input id="headUrl" class="layui-input" maxlength="128" placeholder="图片 URL（可选，留空使用默认头像）"/>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-input-block">
                                    <button type="button" class="layui-btn" id="saveProfile">保存修改</button>
                                    <button type="button" class="layui-btn layui-btn-primary" id="resetProfile">重置</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-xs6 layui-col-md6">
                        <div class="account-info">
                            <div class="row-item"><span class="k">手机号（登录账号）</span><span class="v" id="infoMobile">-</span></div>
                            <div class="row-item"><span class="k">账号角色</span><span class="v" id="infoRole">-</span></div>
                            <div class="row-item"><span class="k">注册时间</span><span class="v" id="infoRegister">-</span></div>
                            <div class="row-item"><span class="k">上次登录</span><span class="v" id="infoLastLogin">-</span></div>
                            <div class="row-item"><span class="k">累计登录</span><span class="v" id="infoLoginCount">-</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 我的秒杀订单 -->
            <div class="panel" id="panel-orders">
                <div class="panel-head">
                    <h3>我的秒杀订单</h3>
                    <span>
                        <span class="desc" id="orderSummary" style="margin:0 12px 0 0"></span>
                        <button type="button" class="layui-btn layui-btn-primary layui-btn-sm" id="refreshOrders"><i class="layui-icon layui-icon-refresh"></i> 刷新</button>
                    </span>
                </div>
                <p class="desc">下单、支付、物流与退款状态一览</p>
                <table class="layui-table">
                    <colgroup>
                        <col style="width:170px"/><col/><col style="width:90px"/><col style="width:70px"/>
                        <col style="width:92px"/><col style="width:150px"/><col style="width:238px"/>
                    </colgroup>
                    <thead>
                    <tr>
                        <th>订单号</th><th>商品</th><th>单价</th><th>数量</th><th>状态</th><th>下单时间</th><th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="ordersBody">
                    <tr><td colspan="7" class="t-empty">正在加载订单...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- 收货地址管理 -->
            <div class="panel" id="panel-address">
                <div class="panel-head">
                    <h3>收货地址管理</h3>
                    <button type="button" class="layui-btn layui-btn-primary layui-btn-sm" id="refreshAddress"><i class="layui-icon layui-icon-refresh"></i> 刷新</button>
                </div>
                <p class="desc">下单时用于填写收货信息，默认地址将优先展示</p>
                <div class="layui-row layui-col-space20">
                    <div class="layui-col-xs7 layui-col-md7">
                        <div id="addrList"><div class="empty-tip">加载中...</div></div>
                    </div>
                    <div class="layui-col-xs5 layui-col-md5">
                        <div class="addr-form-card">
                            <h4 id="addrFormTitle">新增收货地址</h4>
                            <form id="addressForm" class="layui-form">
                                <input type="hidden" id="addressId"/>
                                <div class="layui-form-item">
                                    <label class="layui-form-label">收货人</label>
                                    <div class="layui-input-block"><input id="receiverName" class="layui-input" maxlength="32" required placeholder="收货人姓名"/></div>
                                </div>
                                <div class="layui-form-item">
                                    <label class="layui-form-label">手机号</label>
                                    <div class="layui-input-block"><input id="receiverMobile" class="layui-input" maxlength="11" required placeholder="11 位手机号"/></div>
                                </div>
                                <div class="layui-form-item">
                                    <label class="layui-form-label">省/市/区</label>
                                    <div class="layui-input-block" style="display:flex;gap:8px">
                                        <input id="province" class="layui-input" maxlength="32" required placeholder="省"/>
                                        <input id="city" class="layui-input" maxlength="32" required placeholder="市"/>
                                        <input id="district" class="layui-input" maxlength="32" required placeholder="区/县"/>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <label class="layui-form-label">详细地址</label>
                                    <div class="layui-input-block"><input id="detail" class="layui-input" maxlength="128" required placeholder="街道、门牌号等"/></div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-input-block">
                                        <input type="checkbox" id="defaultAddress" lay-skin="primary" title="设为默认地址"/>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-input-block">
                                        <button type="submit" class="layui-btn">保存地址</button>
                                        <button type="button" class="layui-btn layui-btn-primary" id="resetAddress">清空</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/jquery-validation/lib/jquery-1.11.1.js"></script>
<script src="/js/csrf.js"></script>
<script src="/layui/layui.js"></script>
<script>
layui.use(['layer', 'form'], function () {
    var layer = layui.layer, form = layui.form;
    var $ = window.jQuery;

    var SESSION_ERROR = 500210;
    var statusMap = ['待支付', '待发货', '已发货', '已收货', '已关闭', '已完成', '已退款'];
    var panels = ['profile', 'orders', 'address'];
    var loaded = { orders: false, address: false };
    var addrCache = {};

    function handleError(data, fallback) {
        if (data && Number(data.code) === SESSION_ERROR) {
            location.href = '/login/index?redirect=' + encodeURIComponent('/user.htm');
            return;
        }
        layer.msg((data && data.msg) || fallback);
    }
    function escapeHtml(v) { return $('<div>').text(v == null ? '' : v).html(); }
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function fmtDate(v) {
        if (v == null || v === '') return '-';
        var d = (typeof v === 'number' || /^\d+$/.test(v)) ? new Date(Number(v)) : new Date(v);
        if (isNaN(d.getTime())) return '-';
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
    function renderAvatar(box, head) {
        box.empty();
        if (head) {
            box.append($('<img>').attr('src', head).attr('alt', 'avatar').on('error', function () {
                $(this).remove();
                box.append('<i class="layui-icon layui-icon-username"></i>');
            }));
        } else {
            box.append('<i class="layui-icon layui-icon-username"></i>');
        }
    }
    function roleBadge(role) {
        var r = Number(role);
        if (r === 1) return '<span class="layui-badge layui-bg-green">商家</span>';
        if (r === 9) return '<span class="layui-badge">平台管理员</span>';
        if (r === 0) return '<span class="layui-badge layui-bg-gray">普通用户</span>';
        return '<span class="layui-badge layui-bg-gray">未知</span>';
    }

    /* ---------- 个人资料 ---------- */
    var user = null;
    function renderUser() {
        $('#topNick').text(user.nickname || '');
        $('#ucardName').text(user.nickname || '—');
        $('#ucardPhone').text(user.id || '');
        renderAvatar($('#ucardAvatar'), user.head);
        renderAvatar($('#avatarPreview'), user.head);
        $('#nickname').val(user.nickname || '');
        $('#headUrl').val(user.head || '');
        $('#infoMobile').text(user.id || '-');
        $('#infoRole').html(roleBadge(user.role));
        $('#infoRegister').text(fmtDate(user.registerDate));
        $('#infoLastLogin').text(fmtDate(user.lastLoginDate));
        $('#infoLoginCount').text(user.loginCount == null ? '-' : user.loginCount + ' 次');
    }
    function loadUser() {
        $.get('/user/info', function (res) {
            if (!res || Number(res.code) !== 0) { handleError(res, '获取用户信息失败'); return; }
            if (!res.data) {
                location.href = '/login/index?redirect=' + encodeURIComponent('/user.htm');
                return;
            }
            user = res.data;
            renderUser();
        }).fail(function () { layer.msg('获取用户信息失败，请刷新重试'); });
    }
    $('#headUrl').on('input', function () { renderAvatar($('#avatarPreview'), $.trim($(this).val())); });
    $('#resetProfile').on('click', function () { if (user) renderUser(); });
    $('#saveProfile').on('click', function () {
        var nickname = $.trim($('#nickname').val());
        if (!nickname) { layer.msg('昵称不能为空'); return; }
        if (nickname.length > 64) { layer.msg('昵称最长 64 个字符'); return; }
        var head = $.trim($('#headUrl').val());
        if (head && !/^(\/|https?:\/\/)/.test(head)) { layer.msg('头像地址需以 / 或 http(s):// 开头'); return; }
        $.post('/user/profile', { nickname: nickname, head: head }, function (res) {
            if (res && Number(res.code) === 0) {
                layer.msg('资料已更新', { icon: 1, time: 900 });
                loadUser();
            } else {
                handleError(res, '保存失败');
            }
        }).fail(function () { layer.msg('网络异常，请稍后重试'); });
    });
    $('#logoutBtn').on('click', function () {
        layer.confirm('确定退出当前账号？', { title: '退出确认' }, function (index) {
            layer.close(index);
            $.post('/user/logout', function () { location.href = '/goods/list'; });
        });
    });

    /* ---------- 我的秒杀订单 ---------- */
    function orderRow(o) {
        var status = Number(o.orderStatus), name = escapeHtml(o.goodsName || ('商品 #' + o.goodsId));
        var meta = '收货人：' + escapeHtml(o.deliveryReceiverName || '-');
        if (o.trackingNumber) meta += '　　物流：' + escapeHtml((o.shippingCompany || '') + ' ' + o.trackingNumber);
        var detailUrl = '/order_detail.htm?orderId=' + encodeURIComponent(o.id);
        var btns = '<a class="layui-btn layui-btn-xs layui-btn-primary" href="' + detailUrl + '">查看详情</a>';
        if (status === 0) btns += '<a class="layui-btn layui-btn-xs" href="' + detailUrl + '">立即支付</a>'
            + '<button type="button" class="layui-btn layui-btn-xs layui-btn-primary" data-act="cancel" data-id="' + o.id + '">取消订单</button>';
        if (status === 2) btns += '<button type="button" class="layui-btn layui-btn-xs" data-act="receive" data-id="' + o.id + '">确认收货</button>';
        if (status === 3) btns += '<button type="button" class="layui-btn layui-btn-xs" data-act="complete" data-id="' + o.id + '">完成订单</button>';
        if ([1, 2, 3, 5].indexOf(status) >= 0) {
            btns += o.refundRequestDate
                ? '<span class="layui-badge layui-bg-orange">退款审核中</span>'
                : '<button type="button" class="layui-btn layui-btn-xs layui-btn-primary" data-act="refund" data-id="' + o.id + '">申请退款</button>';
        }
        return '<tr>'
            + '<td>' + o.id + '</td>'
            + '<td><div class="g-name">' + name + '</div><div class="g-meta">' + meta + '</div></td>'
            + '<td>¥ ' + (o.goodsPrice == null ? '-' : o.goodsPrice) + '</td>'
            + '<td>' + (o.goodsCount || 1) + '</td>'
            + '<td><span class="st st-' + status + '">' + (statusMap[status] || '未知') + '</span></td>'
            + '<td>' + fmtDate(o.createDate) + '</td>'
            + '<td class="ops">' + btns + '</td>'
            + '</tr>';
    }
    function loadOrders() {
        $('#ordersBody').html('<tr><td colspan="7" class="t-empty">正在加载订单...</td></tr>');
        $.get('/order/list', { limit: 50 }, function (res) {
            if (!res || Number(res.code) !== 0) { handleError(res, '订单加载失败'); return; }
            var orders = res.data || [];
            $('#orderSummary').text('共 ' + orders.length + ' 笔订单');
            if (!orders.length) {
                $('#ordersBody').html('<tr><td colspan="7" class="t-empty">暂无订单，去参加一场秒杀吧<br/><a class="layui-btn layui-btn-sm" style="margin-top:14px" href="/goods/list">去逛逛</a></td></tr>');
                return;
            }
            var html = '';
            $.each(orders, function (_, o) { html += orderRow(o); });
            $('#ordersBody').html(html);
        }).fail(function () { layer.msg('订单加载失败，请稍后重试'); });
    }
    $('#refreshOrders').on('click', loadOrders);
    var ACTION_MSG = { cancel: '确定取消该未支付订单？', receive: '确认已收到货？', complete: '确认完成该订单？' };
    $('#ordersBody').on('click', 'button[data-act]', function () {
        var act = $(this).data('act'), id = $(this).data('id');
        if (act === 'refund') {
            layer.prompt({ title: '请输入退款原因', formType: 2 }, function (value, index) {
                var reason = $.trim(value);
                if (!reason) { layer.msg('退款原因不能为空'); return; }
                layer.close(index);
                $.post('/order/refund', { orderId: id, reason: reason }, function (res) {
                    if (res && Number(res.code) === 0) { layer.msg('退款申请已提交', { icon: 1, time: 900 }, loadOrders); }
                    else handleError(res, '退款申请失败');
                }).fail(function () { layer.msg('退款申请失败，请稍后重试'); });
            });
            return;
        }
        layer.confirm(ACTION_MSG[act], { title: '操作确认' }, function (index) {
            layer.close(index);
            $.post('/order/' + act, { orderId: id }, function (res) {
                if (res && Number(res.code) === 0) { layer.msg('操作成功', { icon: 1, time: 900 }, loadOrders); }
                else handleError(res, '操作失败');
            }).fail(function () { layer.msg('网络异常，请稍后重试'); });
        });
    });

    /* ---------- 收货地址 ---------- */
    function loadAddresses() {
        $('#addrList').html('<div class="empty-tip">加载中...</div>');
        $.get('/address/list', function (res) {
            if (!res || Number(res.code) !== 0) { handleError(res, '地址加载失败'); return; }
            var list = res.data || [];
            addrCache = {};
            if (!list.length) {
                $('#addrList').html('<div class="empty-tip">暂无收货地址，先在右侧添加一个吧</div>');
                return;
            }
            var html = '';
            $.each(list, function (_, a) {
                addrCache[a.id] = a;
                html += '<div class="addr-card">'
                    + '<div class="addr-info">'
                    + '<div class="addr-line1">' + escapeHtml(a.receiverName) + '<span class="addr-phone">' + escapeHtml(a.receiverMobile) + '</span>'
                    + (a.defaultAddress ? ' <span class="layui-badge">默认</span>' : '') + '</div>'
                    + '<div class="addr-line2">' + escapeHtml((a.province || '') + (a.city || '') + (a.district || '') + (a.detail || '')) + '</div>'
                    + '</div>'
                    + '<div class="addr-ops">'
                    + '<button type="button" class="layui-btn layui-btn-xs layui-btn-primary" data-edit="' + a.id + '"><i class="layui-icon layui-icon-edit"></i>编辑</button>'
                    + '<button type="button" class="layui-btn layui-btn-xs layui-btn-primary" data-del="' + a.id + '"><i class="layui-icon layui-icon-delete"></i>删除</button>'
                    + '</div></div>';
            });
            $('#addrList').html(html);
        }).fail(function () { layer.msg('地址加载失败，请稍后重试'); });
    }
    function fillAddress(a) {
        if (!a) return;
        $('#addrFormTitle').text('编辑收货地址');
        $('#addressId').val(a.id);
        $('#receiverName').val(a.receiverName);
        $('#receiverMobile').val(a.receiverMobile);
        $('#province').val(a.province);
        $('#city').val(a.city);
        $('#district').val(a.district);
        $('#detail').val(a.detail);
        $('#defaultAddress').prop('checked', !!a.defaultAddress);
        form.render('checkbox');
    }
    function resetAddressForm() {
        $('#addressForm')[0].reset();
        $('#addressId').val('');
        $('#addrFormTitle').text('新增收货地址');
        form.render('checkbox');
    }
    $('#refreshAddress').on('click', loadAddresses);
    $('#resetAddress').on('click', resetAddressForm);
    $('#addrList').on('click', 'button[data-edit]', function () { fillAddress(addrCache[$(this).data('edit')]); });
    $('#addrList').on('click', 'button[data-del]', function () {
        var id = $(this).data('del');
        layer.confirm('确认删除该地址？', { title: '删除确认' }, function (index) {
            layer.close(index);
            $.post('/address/delete', { addressId: id }, function (res) {
                if (res && Number(res.code) === 0) { layer.msg('已删除', { icon: 1, time: 800 }); loadAddresses(); }
                else handleError(res, '删除失败');
            }).fail(function () { layer.msg('网络异常，请稍后重试'); });
        });
    });
    $('#addressForm').on('submit', function (e) {
        e.preventDefault();
        var mobile = $.trim($('#receiverMobile').val());
        if (!/^1[3-9]\d{9}$/.test(mobile)) { layer.msg('手机号格式不正确'); return; }
        var data = {
            id: $('#addressId').val() || null,
            receiverName: $.trim($('#receiverName').val()),
            receiverMobile: mobile,
            province: $.trim($('#province').val()),
            city: $.trim($('#city').val()),
            district: $.trim($('#district').val()),
            detail: $.trim($('#detail').val()),
            defaultAddress: $('#defaultAddress').prop('checked')
        };
        $.post('/address/save', data, function (res) {
            if (res && Number(res.code) === 0) {
                layer.msg('地址已保存', { icon: 1, time: 800 });
                resetAddressForm();
                loadAddresses();
            } else {
                handleError(res, '保存失败');
            }
        }).fail(function () { layer.msg('网络异常，请稍后重试'); });
    });

    /* ---------- 面板切换 ---------- */
    function showPanel(name) {
        if (panels.indexOf(name) < 0) name = 'profile';
        $('.uc-menu a').removeClass('on').filter('[data-panel="' + name + '"]').addClass('on');
        $('.panel').removeClass('on');
        $('#panel-' + name).addClass('on');
        if (name === 'orders' && !loaded.orders) { loaded.orders = true; loadOrders(); }
        if (name === 'address' && !loaded.address) { loaded.address = true; loadAddresses(); }
    }
    $('.uc-menu').on('click', 'a[data-panel]', function () { location.hash = '#' + $(this).data('panel'); });
    $(window).on('hashchange', function () { showPanel((location.hash || '#profile').slice(1)); });

    loadUser();
    showPanel((location.hash || '#profile').slice(1));
    form.render();
});
</script>
</body>
</html>
