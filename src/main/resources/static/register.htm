<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>注册账号</title>
    <script src="/jquery-validation/lib/jquery-1.11.1.js"></script><script src="/js/csrf.js"></script><script src="/js/md5.min.js"></script>
    <style>
        body{margin:0;background:#1a1a2e;font-family:'Microsoft YaHei',sans-serif}.wrap{max-width:420px;margin:70px auto;padding:0 16px}
        .brand{color:#fff;text-align:center;font-size:24px;font-weight:bold;margin-bottom:22px}.card{background:#fff;border-radius:8px;padding:24px}
        h2{margin:0 0 20px;font-size:20px}label{display:block;font-size:13px;color:#555;margin:14px 0 5px}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ddd;border-radius:4px}
        button{width:100%;margin-top:20px;padding:11px;border:0;border-radius:4px;background:#e74c3c;color:#fff;cursor:pointer}.hint{text-align:center;margin-top:14px;font-size:13px}.hint a{color:#e74c3c}
    </style>
</head>
<body><div class="wrap"><div class="brand">闪惠智购商城</div><div class="card"><h2>注册账号</h2>
<form id="form"><label>手机号</label><input id="mobile" maxlength="11" required/><label>昵称</label><input id="nickname" maxlength="64" required/><label>密码</label><input id="password" type="password" minlength="5" required/><button type="submit">注册</button></form>
<div class="hint">已有账号？<a href="/login/index">返回登录</a></div></div></div>
<script>
$('#form').on('submit',function(e){e.preventDefault();var mobile=$.trim($('#mobile').val()),nickname=$.trim($('#nickname').val()),raw=$('#password').val();if(!/^1[3-9]\d{9}$/.test(mobile)||!nickname||raw.length<5){alert('请填写正确的注册信息');return;}var salt='1a2b3c4d';var pass=md5(salt[0]+salt[2]+raw+salt[5]+salt[4]);$.post('/user/register',{mobile:mobile,nickname:nickname,password:pass},function(data){if(data&&Number(data.code)===0){alert('注册成功，请登录');location.href='/login/index';}else alert((data&&data.msg)||'注册失败');}).fail(function(){alert('注册失败，请稍后重试');});});
</script></body></html>
