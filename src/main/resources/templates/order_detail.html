<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闪惠智购商城 — 订单详情</title>
    <script type="text/javascript" th:src="@{/jquery-validation/lib/jquery-1.11.1.js}"></script>
    <link  type="text/css" rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.css}"/>
    <script type="text/javascript" th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
    <style>
        body { background: #f4f4f8; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; margin: 0; }
        .topbar { background: linear-gradient(135deg,#1a1a2e,#16213e); padding: 14px 24px;
                  display: flex; align-items: center; justify-content: space-between; }
        .topbar .brand { color: #fff; font-size: 18px; font-weight: 900; letter-spacing: 1px;
                         text-decoration: none; }
        .topbar .brand .accent { color: #e74c3c; }
        .topbar a.back { color: rgba(255,255,255,.6); font-size: 13px; text-decoration: none; }
        .topbar a.back:hover { color: #fff; }
        .wrap { max-width: 640px; margin: 36px auto; padding: 0 16px; }
        .success-banner { background: linear-gradient(135deg,#27ae60,#1e8449); border-radius: 14px;
                          padding: 24px; color: #fff; text-align: center; margin-bottom: 24px; }
        .success-banner .icon { font-size: 48px; }
        .success-banner h3 { margin: 10px 0 4px; font-weight: 700; font-size: 20px; }
        .success-banner p { margin: 0; opacity: .85; font-size: 13px; }
        .card { background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.07);
                overflow: hidden; margin-bottom: 16px; border: none; }
        .card-head { background: #fafafa; border-bottom: 1px solid #f0f0f0;
                     padding: 14px 20px; font-size: 14px; font-weight: 700; color: #333; }
        .info-row { display: flex; padding: 12px 20px; border-bottom: 1px solid #f9f9f9;
                    font-size: 14px; }
        .info-row:last-child { border-bottom: none; }
        .info-row .lbl { color: #888; width: 90px; flex-shrink: 0; }
        .info-row .val { color: #333; font-weight: 500; flex: 1; }
        .tag-status { display: inline-block; background: #fff3e0; color: #e67e22;
                      border-radius: 6px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
        .price-big { font-size: 20px; font-weight: 900; color: #e74c3c; }
        .price-big::before { content: '¥'; font-size: 13px; }
        .btn-pay { background: linear-gradient(135deg,#e74c3c,#c0392b); color: #fff; border: none;
                   border-radius: 8px; padding: 10px 32px; font-size: 14px; font-weight: 600;
                   cursor: pointer; transition: opacity .2s; }
        .btn-pay:hover { opacity: .87; }
        .btn-back { background: #f5f5f5; color: #666; border: none; border-radius: 8px;
                    padding: 10px 24px; font-size: 14px; cursor: pointer; margin-right: 10px; }
        .footer-btns { padding: 16px 20px; text-align: right; }
    </style>
</head>
<body>
<div class="topbar">
    <a class="brand" href="/goods/list">⚡ 闪惠<span class="accent">智购</span>商城</a>
    <div style="display:flex;gap:18px;align-items:center"><a class="back" href="/order_list.htm">我的订单</a><a class="back" href="/goods/list">← 继续购物</a></div>
</div>
<div class="wrap">
    <div class="success-banner">
        <div class="icon">🎉</div>
        <h3>秒杀成功！</h3>
        <p>请尽快完成支付，逾期订单将自动取消</p>
    </div>
    <div class="card">
        <div class="card-head">📦 商品信息</div>
        <div class="info-row">
            <span class="lbl">商品名称</span>
            <span class="val" th:text="${goods.goodsName}">—</span>
        </div>
        <div class="info-row">
            <span class="lbl">秒杀单价</span>
            <span class="val price-big" th:text="${orderinfo.goodsPrice}">—</span>
        </div>
    </div>
    <div class="card">
        <div class="card-head">🧾 订单信息</div>
        <div class="info-row">
            <span class="lbl">下单时间</span>
            <span class="val" th:text="${#dates.format(orderinfo.createDate,'yyyy-MM-dd HH:mm:ss')}">—</span>
        </div>
        <div class="info-row">
            <span class="lbl">订单状态</span>
            <span class="val">
                <span class="tag-status" th:if="${orderinfo.orderStatus eq 0}">待支付</span>
                <span class="tag-status" th:if="${orderinfo.orderStatus eq 1}">待发货</span>
                <span class="tag-status" th:if="${orderinfo.orderStatus eq 2}">已发货</span>
                <span class="tag-status" th:if="${orderinfo.orderStatus == 3}">已收货</span>
                <span class="tag-status" th:if="${orderinfo.orderStatus == 4}">已关闭</span>
                <span class="tag-status" th:if="${orderinfo.orderStatus == 5}">已完成</span>
                <span class="tag-status" th:if="${orderinfo.orderStatus == 6}">已退款</span>
            </span>
        </div>
        <div class="info-row">
            <span class="lbl">收货人</span>
                <span class="val" th:text="${orderinfo.deliveryReceiverName + ' ' + orderinfo.deliveryReceiverMobile}">收货人</span>
        </div>
        <div class="info-row">
            <span class="lbl">收货地址</span>
                <span class="val" th:text="${orderinfo.deliveryAddress}">收货地址</span>
        </div>
        <div class="footer-btns">
            <button class="btn-back" onclick="history.back()">返回</button>
            <button class="btn-pay" id="payButton">立即支付</button>
        </div>
    </div>
</div>
</body>
</html>
