<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闪惠智购商城 — 秒杀失败</title>
    <script type="text/javascript" th:src="@{/jquery-validation/lib/jquery-1.11.1.js}"></script>
    <link  type="text/css" rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.css}"/>
    <script type="text/javascript" th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
    <style>
        body { background: #f4f4f8; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; margin: 0; }
        .topbar { background: linear-gradient(135deg,#1a1a2e,#16213e); padding: 14px 24px;
                  display: flex; align-items: center; }
        .topbar .brand { color: #fff; font-size: 18px; font-weight: 900; letter-spacing: 1px;
                         text-decoration: none; }
        .topbar .brand .accent { color: #e74c3c; }
        .wrap { max-width: 480px; margin: 80px auto; padding: 0 16px; text-align: center; }
        .icon { font-size: 72px; margin-bottom: 16px; }
        .title { font-size: 24px; font-weight: 700; color: #333; margin-bottom: 10px; }
        .msg  { font-size: 14px; color: #888; margin-bottom: 30px; line-height: 1.6; }
        .btn-back { display: inline-block; background: linear-gradient(135deg,#e74c3c,#c0392b);
                    color: #fff; border-radius: 8px; padding: 10px 32px; font-size: 14px;
                    font-weight: 600; text-decoration: none; transition: opacity .2s; }
        .btn-back:hover { opacity: .85; color: #fff; text-decoration: none; }
        .btn-outline { display: inline-block; border: 1.5px solid #e74c3c; color: #e74c3c;
                       border-radius: 8px; padding: 10px 28px; font-size: 14px; font-weight: 600;
                       text-decoration: none; margin-left: 10px; transition: all .2s; }
        .btn-outline:hover { background: #e74c3c; color: #fff; text-decoration: none; }
    </style>
</head>
<body>
<div class="topbar">
    <a class="brand" href="/goods/list">⚡ 闪惠<span class="accent">智购</span>商城</a>
</div>
<div class="wrap">
    <div class="icon">😔</div>
    <div class="title">很遗憾，秒杀未成功</div>
    <div class="msg" th:text="${errorMessage}">商品已售罄或活动已结束，下次早点来哦～</div>
    <a href="/goods/list" class="btn-back">返回商品列表</a>
    <a href="/ai/guide"   class="btn-outline">🤖 AI 帮我选</a>
</div>
</body>
</html>
