<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闪惠智购商城 — 登录</title>
    <script type="text/javascript" th:src="@{/jquery-validation/lib/jquery-1.11.1.js}"></script>
    <link  type="text/css" rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.css}"/>
    <script type="text/javascript" th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
    <script type="text/javascript" th:src="@{/jquery-validation/jquery.validate.min.js}"></script>
    <script type="text/javascript" th:src="@{/jquery-validation/localization/messages_zh.min.js}"></script>
    <script type="text/javascript" th:src="@{/js/csrf.js}"></script>
    <script type="text/javascript" th:src="@{/js/md5.min.js}"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%); min-height: 100vh;
               display: flex; align-items: center; justify-content: center; margin: 0;
               font-family: 'PingFang SC','Microsoft YaHei',sans-serif; }
        .login-wrap { width: 420px; max-width: 95vw; }
        .brand { text-align: center; margin-bottom: 28px; }
        .brand .logo { font-size: 30px; font-weight: 900; color: #fff; letter-spacing: 2px; }
        .brand .logo .accent { color: #e74c3c; }
        .brand .tagline { color: rgba(255,255,255,.45); font-size: 13px; margin-top: 6px; }
        .card { border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.4); overflow: hidden; }
        .card-top { background: linear-gradient(135deg,#e74c3c,#c0392b); padding: 20px 28px; }
        .card-top h5 { color: #fff; margin: 0; font-weight: 700; font-size: 16px; letter-spacing: .5px; }
        .card-body { padding: 30px 28px; background: #fff; }
        .form-group { margin-bottom: 18px; }
        .form-group label { font-size: 13px; color: #555; font-weight: 600; margin-bottom: 5px; display: block; }
        .form-ctrl { border-radius: 8px; border: 1.5px solid #e0e0e0; padding: 10px 14px; font-size: 14px;
                     width: 100%; transition: border .2s; outline: none; }
        .form-ctrl:focus { border-color: #e74c3c; box-shadow: 0 0 0 3px rgba(231,76,60,.1); }
        .btn-login { background: linear-gradient(135deg,#e74c3c,#c0392b); border: none; border-radius: 8px;
                     width: 100%; padding: 11px; font-size: 15px; font-weight: 700; color: #fff;
                     letter-spacing: 1px; cursor: pointer; transition: opacity .2s; margin-top: 6px; }
        .btn-login:hover { opacity: .87; }
        .hint { text-align: center; margin-top: 16px; font-size: 12px; color: rgba(255,255,255,.35); }
        em.invalid-feedback { color: #e74c3c; font-size: 12px; font-style: normal; display: block; margin-top: 3px; }
        .is-invalid { border-color: #e74c3c !important; }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="brand">
        <div class="logo">⚡ 闪惠<span class="accent">智购</span>商城</div>
        <div class="tagline">限时抢购 · AI智能导购 · 极速下单</div>
    </div>
    <div class="card">
        <div class="card-top"><h5>🔐 用户登录</h5></div>
        <div class="card-body">
            <form id="signupForm" method="post">
                <div class="form-group">
                    <label for="phone">手机号</label>
                    <input type="text" class="form-ctrl" id="phone" name="phone" placeholder="请输入手机号"/>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" class="form-ctrl" id="password" name="password" placeholder="请输入密码"/>
                </div>
                <button type="submit" class="btn-login">立即登录</button>
            </form>
            <div style="text-align:center;margin-top:16px;font-size:13px"><a href="/register.htm" id="registerLink" style="color:#e74c3c">注册新账号</a></div>
        </div>
    </div>
    <div class="hint">测试账号：15200000000 ~ 15200000997 &nbsp;|&nbsp; 密码：123456</div>
</div>
<script type="text/javascript">
    /** 读取 ?redirect= 并只接受站内相对路径（防开放重定向），不合法时返回 fallback。 */
    function getSafeRedirect(fallback) {
        var r = null;
        try { r = new URLSearchParams(window.location.search).get("redirect"); } catch (e) { }
        if (r && r.charAt(0) === "/" && r.charAt(1) !== "/"
            && r.indexOf("\\") === -1 && r.indexOf("://") === -1) {
            return r;
        }
        return fallback;
    }
    $.validator.setDefaults({
        submitHandler: function () {
            var pass = $("#password").val();
            var salt = '1a2b3c4d';
            var str = "" + salt.charAt(0) + salt.charAt(2) + pass + salt.charAt(5) + salt.charAt(4);
            var password = md5(str);
            $.ajax({
                url: "/login/do_login", type: "POST",
                data: { mobile: $("#phone").val(), password: password },
                success: function (data) {
                    if (data.code == 0) { window.location.href = getSafeRedirect("/goods/list"); }
                    else { alert(data.msg); }
                },
                error: function () { alert("登录失败，请稍后重试"); }
            });
        }
    });
    $(document).ready(function () {
        var redirect = getSafeRedirect(null);
        if (redirect) {
            $("#registerLink").attr("href", "/register.htm?redirect=" + encodeURIComponent(redirect));
        }
        $("#signupForm").validate({
            rules: { phone: { required: true }, password: { required: true, minlength: 5 } },
            messages: { phone: "请输入手机号", password: { required: "请输入密码", minlength: "密码至少5位" } },
            errorElement: "em",
            errorPlacement: function (error, element) { error.addClass("invalid-feedback"); error.insertAfter(element); },
            highlight:   function (element) { $(element).addClass("is-invalid").removeClass("is-valid"); },
            unhighlight: function (element) { $(element).addClass("is-valid").removeClass("is-invalid"); }
        });
    });
</script>
</body>
</html>
