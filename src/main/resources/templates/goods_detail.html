<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闪惠智购商城 — 商品详情</title>
    <script type="text/javascript" th:src="@{/jquery-validation/lib/jquery-1.11.1.js}"></script>
    <link  type="text/css" rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.css}"/>
    <script type="text/javascript" th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
    <style>
        body { background: #f4f4f8; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; margin: 0; }
        .topbar { background: linear-gradient(135deg,#1a1a2e,#16213e); padding: 14px 24px;
                  display: flex; align-items: center; justify-content: space-between; }
        .topbar .brand { color: #fff; font-size: 18px; font-weight: 900; text-decoration: none; }
        .topbar .brand .accent { color: #e74c3c; }
        .topbar a.back { color: rgba(255,255,255,.55); font-size: 13px; text-decoration: none; }
        .topbar a.back:hover { color: #fff; }
        .wrap { max-width: 860px; margin: 28px auto; padding: 0 16px; }
        .detail-card { background: #fff; border-radius: 14px; box-shadow: 0 2px 14px rgba(0,0,0,.08);
                       overflow: hidden; display: flex; flex-wrap: wrap; }
        .thumb-col { width: 320px; background: linear-gradient(135deg,#f5f5f5,#ececec);
                     display: flex; align-items: center; justify-content: center; font-size: 100px;
                     min-height: 280px; flex-shrink: 0; overflow:hidden; }
        .thumb-col img { width:100%; height:100%; object-fit:cover; }
        .info-col { flex: 1; padding: 28px; min-width: 260px; }
        .goods-title { font-size: 20px; font-weight: 700; color: #222; margin-bottom: 16px; line-height: 1.4; }
        .price-block { background: #fff8f8; border-radius: 10px; padding: 14px 18px; margin-bottom: 18px; }
        .price-seckill { font-size: 34px; font-weight: 900; color: #e74c3c; }
        .price-seckill::before { content: '¥'; font-size: 18px; }
        .price-origin { font-size: 13px; color: #aaa; text-decoration: line-through; margin-left: 10px; }
        .price-origin::before { content: '原价 ¥'; }
        .meta-row { display: flex; font-size: 13px; color: #666; margin-bottom: 10px; }
        .meta-row .lbl { color: #aaa; width: 80px; }
        .countdown-box { background: #1a1a2e; color: #fff; border-radius: 10px; padding: 12px 16px;
                         margin-bottom: 18px; display: flex; align-items: center; gap: 12px; font-size: 13px; }
        .countdown-box .cd-num { background: #e74c3c; border-radius: 6px; padding: 4px 8px;
                                  font-size: 20px; font-weight: 900; min-width: 36px; text-align: center; }
        .countdown-box .cd-sep { font-size: 20px; font-weight: 900; color: #e74c3c; }
        .tip-running { color: #27ae60; font-weight: 600; }
        .tip-ended   { color: #aaa; }
        .vcode-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .vcode-row img { border-radius: 6px; cursor: pointer; height: 36px; }
        .vcode-row input { border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 8px 12px;
                           font-size: 14px; width: 120px; outline: none; }
        .btn-seckill { background: linear-gradient(135deg,#e74c3c,#c0392b); color: #fff; border: none;
                       border-radius: 10px; padding: 13px 40px; font-size: 16px; font-weight: 700;
                       cursor: pointer; letter-spacing: 1px; transition: opacity .2s; }
        .btn-seckill:disabled { opacity: .4; cursor: not-allowed; }
        .btn-seckill:not(:disabled):hover { opacity: .87; }
        @media(max-width:640px) { .thumb-col { width: 100%; min-height: 180px; font-size: 70px; }
                                   .info-col { padding: 20px 16px; } }
    </style>
</head>
<body>
<div class="topbar">
    <a class="brand" href="/goods/list">⚡ 闪惠<span class="accent">智购</span>商城</a>
    <div style="display:flex;gap:18px;align-items:center"><a class="back" href="/order_list.htm">我的订单</a><a class="back" href="/goods/list">← 返回列表</a></div>
</div>
<div class="wrap">
    <div class="detail-card">
        <div class="thumb-col"><img th:if="${goods.goodsImg != null and !#strings.isEmpty(goods.goodsImg)}" th:src="${goods.goodsImg}" alt="商品图片"/><span th:unless="${goods.goodsImg != null and !#strings.isEmpty(goods.goodsImg)}">🛍️</span></div>
        <div class="info-col">
            <span th:if="${user eq null}" style="color:#e74c3c;font-size:13px;display:block;margin-bottom:12px;">
                ⚠️ 您尚未登录，请 <a id="loginLink" href="/login/index" style="color:#e74c3c;font-weight:600;">点此登录</a> 后参与秒杀
            </span>
            <div class="goods-title" th:text="${goods.goodsName}">商品名称</div>
            <div class="price-block">
                <span class="price-seckill" th:text="${goods.seckillPrice}">0</span>
                <span class="price-origin"  th:text="${goods.goodsPrice}">0</span>
            </div>
            <div class="meta-row"><span class="lbl">库存</span><span th:text="${goods.stockCount} + ' 件'">—</span></div>
            <div class="meta-row"><span class="lbl">开始时间</span>
                <span th:text="${#dates.format(goods.startDate,'MM-dd HH:mm')}">—</span></div>
            <div id="seckillTip" class="countdown-box" style="display:none"></div>
            <input type="hidden" id="remainingSeconds" th:value="${remainingSeconds}"/>
            <form id="seckillForm" method="post" action="/seckill/seckillWithoutCache" style="margin-top:8px;">
                <button class="btn-seckill" type="submit" id="buyButton"
                        th:disabled="${goods.activityStatus != 1 or goods.soldOut}"
                        th:attr="data-sold-out=${goods.soldOut}">⚡ 立即秒杀</button>
                <input type="hidden" name="goodsId" th:value="${goods.id}"/>
            </form>
        </div>
    </div>
</div>
<script>
    $(function () {
        $("#loginLink").attr("href", "/login/index?redirect=" + encodeURIComponent(window.location.pathname + window.location.search));
        countDown();
    });
    function countDown() {
        var s = parseInt($("#remainingSeconds").val());
        var tip = $("#seckillTip");
        tip.show();
        if (s > 0) {
            $("#buyButton").prop("disabled", true);
            var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
            tip.html('距开抢：<span class="cd-num">' + pad(h) + '</span><span class="cd-sep">:</span>' +
                     '<span class="cd-num">' + pad(m) + '</span><span class="cd-sep">:</span>' +
                     '<span class="cd-num">' + pad(sec) + '</span>');
            setTimeout(function () { $("#remainingSeconds").val(s-1); countDown(); }, 1000);
        } else if (s == 0 && $("#buyButton").attr("data-sold-out") !== "true") {
            $("#buyButton").prop("disabled", false);
            tip.html('<span class="tip-running">🔥 秒杀进行中！</span>');
        } else {
            $("#buyButton").prop("disabled", true);
            tip.html('<span class="tip-ended">' + ($("#buyButton").attr("data-sold-out") === "true" ? '本场秒杀已售罄' : '本场秒杀已结束') + '</span>');
        }
    }
    function pad(n) { return n < 10 ? '0'+n : ''+n; }
</script>
</body>
</html>
