global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Application-side metrics. The app must be reachable from the Compose network.
  - job_name: seckill-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # Blackbox Exporter provides outside-in HTTP availability and latency.
  - job_name: seckill-blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:8080/goods/detailStatic/1
          - http://host.docker.internal:8080/login/index
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # Add exporters you have explicitly deployed and secured. Examples:
  # - job_name: node
  #   static_configs: [{targets: ["node-exporter:9100"]}]
  # - job_name: mysql
  #   static_configs: [{targets: ["mysqld-exporter:9104"]}]
  # - job_name: redis
  #   static_configs: [{targets: ["redis-exporter:9121"]}]
  # - job_name: rabbitmq
  #   static_configs: [{targets: ["rabbitmq:15692"]}]
